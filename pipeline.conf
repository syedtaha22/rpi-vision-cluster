# Sobel Pipeline Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Format (space-separated):
#   rank  role  recv_from  send_to [send_to ...]  |  omp_threads  width  height
#
# send_to list is terminated by a literal "|" token.
# recv_from = -1 means "no MPI input" (ingestion reads from HTTP/WebSocket).
#
# For THRESHOLD (rank 5), recv_from is unused (uses MPI_ANY_SOURCE).
# Set it to -1.
#
# ─────────────────────────────────────────────────────────────────────────────
# TOPOLOGY:
#
#   [Browser] --WiFi--> [Pi 1: rank 0 INGESTION]
#                               |
#                        [Pi 2: rank 1 GRAYSCALE]
#                       /        |        \
#            [Pi 3: rank 2]  [Pi 4: rank 3]  [Pi 5: rank 4]
#            CONVOLUTION     CONVOLUTION     CONVOLUTION
#                       \        |        /
#                        [Pi 6: rank 5 THRESHOLD]
#                               |
#                        [Pi 1: rank 0 INGESTION]
#                               |
#                    [Browser] <--WiFi--
#
# ─────────────────────────────────────────────────────────────────────────────

# rank  role         recv_from   send_to             |  omp_threads  width  height
0       INGESTION    5           1                   |  4            640    480
1       GRAYSCALE    0           2 3 4               |  4            640    480
2       CONVOLUTION  1           5                   |  4            640    480
3       CONVOLUTION  1           5                   |  4            640    480
4       CONVOLUTION  1           5                   |  4            640    480
5       THRESHOLD    -1          0                   |  4            640    480
