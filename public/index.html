<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Sobel Edge Detection</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Real-Time Sobel Edge Detection</h1>
      <div class="controls">
        <button id="rawToggleBtn" type="button">Hide Raw Feed</button>
        <button id="toggleBtn" type="button">Start</button>
      </div>
    </header>

    <section class="panes">
      <article class="pane pane--raw">
        <h2>Raw Camera Feed</h2>
        <video id="rawVideo" autoplay muted playsinline></video>
      </article>
      <article class="pane pane--processed">
        <h2>Processed Feed (Server)</h2>
        <canvas id="processedCanvas" width="640" height="480"></canvas>
      </article>
    </section>
  </main>

  <canvas id="captureCanvas" width="640" height="480" hidden></canvas>
  <script src="/script.js"></script>
</body>
</html>
